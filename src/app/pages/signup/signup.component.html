<app-default-login-layout
  title="Sign in and start today!"
  primaryButtonText="Signup Now"
  secondaryButtonText="Login Now"
  (submit)="submit()"
  (navigate)="navigate()"
  [disablePrimaryBtn]="!signupForm.valid"
>
<form [formGroup]="signupForm">
    <app-primary-input
    formControlName="name"
    label="Name"
    type="text"
    inputName="name"
    placeholder="John Doe"
  >
      <img src="/assets/svg/email-icon.svg"/>
  </app-primary-input>
  <app-primary-input
    formControlName="email"
    label="E-mail"
    type="email"
    inputName="email"
    placeholder="johndoe@gmail.com"
  >
      <img src="/assets/svg/email-icon.svg"/>
  </app-primary-input>
  <app-primary-input
    formControlName="password"
    label="Password"
    type="password"
    inputName="password"
  > 
      <img src="/assets/svg/password-icon.svg"/>
  </app-primary-input>
    <app-primary-input
    formControlName="passwordConfirm"
    label="Confirm your Password"
    type="password"
    inputName="passwordConfirm"
  >
      <img src="/assets/svg/password-icon.svg"/>
  </app-primary-input>
</form>
</app-default-login-layout>
